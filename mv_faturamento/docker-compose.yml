# Hospital Sao Lucas (ficticio): HIS no estilo MV Soul em Oracle 23ai Free, faturamento de convenio. Entra pela Central.
# Dados gerados por mocks/mv_faturamento/gerar_mv.py. Detalhes em mocks/mv_faturamento/README.md.
#
#   docker compose -f mv_faturamento/docker-compose.yml up -d     # ~1,5 GB de RAM; 1a subida leva ~1 min
#
# O seed roda so na primeira subida (volume vazio). Para recarregar: down -v e up de novo.

services:
  mv-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: qimed-mv-db
    environment:
      ORACLE_PASSWORD: ${MV_SYS_PASSWORD:-mv_sys}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:1523:1521"
    volumes:
      - ./sql:/container-entrypoint-initdb.d:ro
      - mv-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - qimed-network

volumes:
  mv-data:

networks:
  qimed-network:
    external: true
