# Hospital Sao Lucas (ficticio): HIS no estilo MV Soul em Oracle 11g R2 XE, faturamento de convenio. Entra pela
# Central. Dados gerados por gerar_mv.py. Detalhes em README.md.
#
#   docker compose -f mv_faturamento/docker-compose.yml up -d --wait   # ~1 GB de RAM; 1a subida leva ~2 min
#
# O seed roda so na primeira subida (volume vazio). Para recarregar: down -v e up de novo.
# O 11g so aceita o python-oracledb em modo thick (Instant Client na imagem do pipeline).

services:
  mv-db:
    image: gvenzl/oracle-xe:11-slim
    container_name: qimed-mv-db
    shm_size: 1g
    environment:
      ORACLE_PASSWORD: ${MV_SYS_PASSWORD:-mv_sys}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:1523:1521"
    volumes:
      - ./sql:/container-entrypoint-initdb.d:ro
      - mv-data:/u01/app/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - qimed-network

volumes:
  mv-data:

networks:
  qimed-network:
    external: true
