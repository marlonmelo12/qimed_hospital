# GNU Health HIS 5.0 (produto real, Tryton 7.0): o banco que o trytond criou, restaurado do dump do repo GNU_helth.
# Entra pela Central de Conexoes como Postgres. Sem o servidor Tryton: a Central so le SQL.
#
#   docker compose -f mocks/gnuhealth/docker-compose.yml up -d
#
# O restore roda so na primeira subida (volume vazio). Para recarregar: down -v e up de novo.

services:
  gnuhealth-db:
    image: postgres:16-alpine
    container_name: qimed-gnuhealth-central-db
    environment:
      POSTGRES_DB: gnuhealth
      POSTGRES_USER: gnuhealth
      POSTGRES_PASSWORD: ${GNUHEALTH_DB_PASSWORD:-gnuhealth}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - gnuhealth-central-data:/var/lib/postgresql/data
    healthcheck:
      # pronto so depois do restore e do usuario de leitura (o init roda num servidor temporario)
      test: ["CMD-SHELL", "psql -U gnuhealth -d gnuhealth -tAc \"select 1 from pg_roles where rolname='qimed_leitura'\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - qimed-network

volumes:
  gnuhealth-central-data:

networks:
  qimed-network:
    external: true
