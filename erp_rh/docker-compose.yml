# ERP de RH e ponto (ficticio) em MariaDB que o QIMED nunca viu. Entra pela Central de Conexoes.
# Dados gerados por mocks/erp_rh/gerar_erp_rh.py. Detalhes em mocks/erp_rh/README.md.
#
#   docker compose -f mocks/erp_rh/docker-compose.yml up -d
#
# O seed roda so na primeira subida (volume vazio). Para recarregar: down -v e up de novo.

services:
  erp-rh-db:
    image: mariadb:11.4.4
    container_name: qimed-erp-rh-db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_DATABASE: erp_rh
      MARIADB_USER: ${ERP_RH_DB_USER:-erp}
      MARIADB_PASSWORD: ${ERP_RH_DB_PASSWORD:-erp_mock}
      MARIADB_ROOT_PASSWORD: ${ERP_RH_DB_ROOT_PASSWORD:-erp_mock_root}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3308:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - erp-rh-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - qimed-network

volumes:
  erp-rh-data:

networks:
  qimed-network:
    external: true
