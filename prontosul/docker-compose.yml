# ProntoSul (ficticio): pronto-atendimento em Oracle 23ai Free que o QIMED nunca viu. Entra pela Central de Conexoes.
# Dados gerados por mocks/prontosul/gerar_prontosul.py. Detalhes em mocks/prontosul/README.md.
#
#   docker compose -f mocks/prontosul/docker-compose.yml up -d     # ~1,5 GB de RAM; 1a subida leva ~1 min
#
# O seed roda so na primeira subida (volume vazio). Para recarregar: down -v e up de novo.

services:
  prontosul-db:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: qimed-prontosul-db
    environment:
      ORACLE_PASSWORD: ${PRONTOSUL_SYS_PASSWORD:-prontosul_sys}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:1522:1521"
    volumes:
      - ./sql:/container-entrypoint-initdb.d:ro
      - prontosul-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - qimed-network

volumes:
  prontosul-data:

networks:
  qimed-network:
    external: true
