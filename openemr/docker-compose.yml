# Mock Clinica Vale Sul: banco de um OpenEMR 8.5.0 real, gerado pela fabrica (fabrica/fabricar.sh). So o banco sobe.
#   docker compose -f openemr/docker-compose.yml up -d --wait   # 127.0.0.1:3310
#   docker compose -f openemr/docker-compose.yml down -v        # a proxima subida recarrega o dump
services:
  openemr-db:
    image: mariadb:11.4
    container_name: qimed-openemr-db
    command: ["mariadbd", "--character-set-server=utf8mb4"]
    environment:
      MARIADB_ROOT_PASSWORD: openemr_mock_root
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3310:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - openemr-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - qimed-network

volumes:
  openemr-data:

networks:
  qimed-network:
    external: true
