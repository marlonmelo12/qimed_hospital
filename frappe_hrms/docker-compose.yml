# Mock Hospital Sao Rafael: banco de um Frappe HRMS 15 real, gerado pela fabrica (fabrica/fabricar.sh). So o banco sobe.
#   docker compose -f frappe_hrms/docker-compose.yml up -d --wait   # 127.0.0.1:3311
#   docker compose -f frappe_hrms/docker-compose.yml down -v        # a proxima subida recarrega o dump
services:
  frappe-db:
    image: mariadb:10.6
    container_name: qimed-frappe-db
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MARIADB_ROOT_PASSWORD: frappe_mock_root
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:3311:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - frappe-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 60
    networks:
      - qimed-network

volumes:
  frappe-data:

networks:
  qimed-network:
    external: true
